overrides:
  # deepmerge-ts < 8.0.0 exhausts the stack when merging recursive object
  # graphs (GHSA-ggr8-5vv4-36mx, high). It reaches this repository only
  # transitively, through @prisma/config -> prisma, where it merges the
  # Prisma configuration file this repository authors — not attacker-supplied
  # input — so the reachable severity here is far below the advisory's. The
  # override is applied anyway: an unpatched high advisory against the
  # lockfile is a standing supply-chain finding that every future reviewer has
  # to re-triage, and forcing the patched line costs nothing if the resolution
  # holds. If it ever conflicts with a Prisma upgrade, remove it and record
  # the reachability argument instead of pinning around the conflict.
  deepmerge-ts: '>=8.0.0'

# apps/mobile is a Flutter project, not a pnpm package — excluded explicitly.
packages:
  - 'apps/*'
  - '!apps/mobile'
  - 'packages/*'
  # Modules join as they gain code (clean-architecture.md §5: cross-module
  # imports resolve as @karar/<module> -> public-api.ts). Directories without
  # a package.json are ignored, so skeleton modules cost nothing here.
  - 'modules/*'
  # Cross-cutting test suites that belong to no single module (tests/security:
  # the adversarial isolation and privilege-abuse suite spanning Phase 3
  # module boundaries).
  - 'tests/*'
allowBuilds:
  # Transitive dep of the OTLP HTTP exporters (apps/api). Its postinstall is a
  # version-stub writer the library does not need — never run it.
  # Prisma requires its postinstall to fetch the query engine; both are the
  # official Prisma packages, pinned via the lockfile.
  '@prisma/engines': true
  # argon2 (modules/identity) compiles its native binding at install time —
  # that is the official package's normal build, pinned via the lockfile.
  argon2: true
  prisma: true
  protobufjs: false
minimumReleaseAgeExclude:
  # jose 6.2.9 is the exact signing-library release the identity module was
  # built and tested against; it was adopted inside the cool-down window to
  # avoid pinning an older release. No advisory was published against it at
  # adoption (2026-08-16); the exclusion is version-exact and expires with
  # the next jose upgrade.
  - jose@6.2.9
