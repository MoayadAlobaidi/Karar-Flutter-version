name: karar_mobile
description: "Karar consumer client — application shell, platform foundation."
# Never published to pub.dev. The generated API client in
# lib/core/networking/generated is an INTERNAL first-party client; public SDK
# publication is a later phase.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# EVERY direct dependency — main and dev, SDK packages excepted — carries an
# exact version, with no caret and no range. A fintech client must build
# identically from a clean checkout; pubspec.lock records the transitive closure
# and is committed alongside this file.
#
# A range here would not be a smaller version of that rule, it would be the
# absence of it: a range lets a republished upstream change what builds without
# changing what is reviewed. If a dependency is ever found where an exact pin is
# technically untenable, the range is stated NEXT TO IT with the constraint that
# forces it — never left to be inferred. There is no such dependency today.
#
# Pinning a direct dependency does not pin its federated implementations or its
# transitive closure; those resolve on their own constraints and pubspec.lock is
# what records them. That is the lockfile's job, not this file's, and it is not
# a reason to leave a direct dependency ranged.
#
# `flutter pub get --enforce-lockfile` is the check that turns the lockfile into
# an enforced boundary rather than a record — it fails on any resolution that
# would deviate, transitive included. Every CI invocation passes it, so the
# transitive closure is enforced on the build machine and not merely recorded.
# The exact pins above remain the control for the direct set; the two together
# are what make the resolution reproducible.
dependencies:
  flutter:
    sdk: flutter

  # Framework-supplied localization delegates. Message catalogues are generated
  # from lib/l10n/arb by `flutter gen-l10n` (see l10n.yaml).
  flutter_localizations:
    sdk: flutter

  # The version flutter_localizations requires (it declares `intl: ^0.20.3`),
  # written out rather than left to `any`. The SDK constraint still governs
  # which versions are admissible; this states which one actually ships, so a
  # Flutter SDK upgrade that moves it is a visible diff here.
  intl: 0.20.3

  cupertino_icons: 1.0.8

  # Transport. Chosen for interceptor composition, typed timeouts and
  # cancellation tokens; TLS validation is delegated to the platform stack.
  dio: 5.11.0

  # State and composition. Riverpod is the ONLY composition mechanism — there
  # is no global service locator. Riverpod types must never appear in a
  # feature's domain layer.
  flutter_riverpod: 3.4.2

  # Declarative routing. Route selection is driven by the startup coordinator,
  # never by ad-hoc widget-level decisions.
  go_router: 17.5.0

  # Platform secure storage: iOS Keychain, Android Keystore-backed
  # EncryptedSharedPreferences. Tokens live here and nowhere else.
  flutter_secure_storage: 11.0.0

  # Non-sensitive preferences only (locale, theme, biometric-lock choice).
  shared_preferences: 2.5.5

  # The platform authenticator behind the application lock. The device
  # compares and answers yes or no: no template, image or derived
  # representation is received, stored or transmitted, and no key ceremony of
  # this client's own design wraps it. Exact-pinned like everything else, and
  # deliberately so for this one: it is the dependency that decides whether the
  # lock opens, and it contributes permissions to the shipped manifest
  # (see android/app/src/main/AndroidManifest.xml and the merged-manifest
  # allow-list in test/security/platform_hardening_test.dart).
  local_auth: 3.0.2

  # Annotations usable from pure-Dart domain code (@immutable) without
  # dragging in the Flutter framework. The Flutter SDK constrains this to
  # ^1.18.3; 1.19.0 is the version inside that constraint which ships.
  meta: 1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

  # Used only by tool/generate_api_client.dart. Dev dependencies are pinned on
  # the same rule as main ones: a generator that changes without a reviewed diff
  # changes committed output.
  yaml: 3.1.3
  path: 1.9.1

  # The federated platform interface behind shared_preferences. Declared here
  # rather than suppressed with `depend_on_referenced_packages`: the security-
  # state adapter's tests register a fake platform to make a real platform
  # fault reachable, and a test that reaches into a transitive package is
  # depending on it whether or not the pubspec admits it. Pinned exactly on the
  # same rule as everything else, and it must move with shared_preferences.
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  # Required by `flutter gen-l10n`: without it the generator refuses to run.
  # The generated catalogues are committed, so analyze/test/build work either
  # way; this keeps regeneration possible.
  generate: true
