# Static analysis for the Karar client.
#
# Two rules here are load-bearing rather than stylistic:
#   * strict-raw-types and strict-casts keep untyped `dynamic` out of the
#     boundary between generated DTOs and hand-written mapping code, so a
#     contract change surfaces as a compile error instead of a runtime cast.
#   * avoid_print bans the framework print sink outright. All diagnostics go
#     through core/logging, which redacts by default.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # An unawaited future in a fintech client is a lost failure.
    unawaited_futures: error
    # Dead null-aware code usually means a nullability assumption drifted.
    invalid_null_aware_operator: error
    # `flutter gen-l10n` emits its own file-level lint suppression on top of
    # the configured header, which the analyzer then reports as redundant.
    # The duplication is the generator's, not the codebase's.
    duplicate_ignore: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Disabled deliberately: the codebase declares private fields with public
    # named constructor parameters (`AppLogger({required LogSink sink}) :
    # _sink = sink`). An initialising formal cannot express that, because a
    # named parameter may not be private.
    prefer_initializing_formals: false

    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    directives_ordering: true
    implicit_call_tearoffs: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    only_throw_errors: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    prefer_single_quotes: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_parenthesis: true
    unnecessary_statements: true
    use_string_buffers: true
