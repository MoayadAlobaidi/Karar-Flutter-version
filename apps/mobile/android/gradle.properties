org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# app/build.gradle.kts compiles against SDK 37 because flutter_secure_storage
# 11.0.0 requires it. AGP 9.1.0's maximum *recommended* compile SDK is 36, so it
# emits a warning; this acknowledges it. The alternative was to drop the plugin
# that keeps session tokens in Keystore-backed storage, which is not a trade
# this product makes. Remove this line once AGP recommends 37 or later.
android.suppressUnsupportedCompileSdk=37
