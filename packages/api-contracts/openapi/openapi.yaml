  /auth/sessions:
    $ref: './paths/identity.yaml#/~1auth~1sessions'
  /auth/sessions/{sessionId}:
    $ref: './paths/identity.yaml#/~1auth~1sessions~1{sessionId}'
  /auth/sessions/revoke-others:
