  /users/me:
    $ref: './paths/users.yaml#/~1users~1me'
  /users/me/disable-request:
    $ref: './paths/users.yaml#/~1users~1me~1disable-request'
  /tenancy/tenant:
    $ref: './paths/tenancy.yaml#/~1tenancy~1tenant'
  # The caller's OWN memberships, deliberately not tenant-bound: a session
  # already bound to one tenant cannot otherwise discover what it may switch to.
  /tenancy/memberships:
    $ref: './paths/tenancy.yaml#/~1tenancy~1memberships'
  /tenancy/members:
    $ref: './paths/tenancy.yaml#/~1tenancy~1members'
  /tenancy/invitations:
    $ref: './paths/tenancy.yaml#/~1tenancy~1invitations'
  /tenancy/invitations/{invitationId}/revoke:
    $ref: './paths/tenancy.yaml#/~1tenancy~1invitations~1{invitationId}~1revoke'
  /tenancy/invitations/redeem:
    $ref: './paths/tenancy.yaml#/~1tenancy~1invitations~1redeem'
  /consent/documents:
    $ref: './paths/consent.yaml#/~1consent~1documents'
  # The text itself, addressed by DOCUMENT rather than by version: the server
  # picks the version in force, so no draft or superseded text is reachable, and
  # the bytes are checked against that version's pinned hash before they are
  # served. The listing carries no internal storage locator as a result.
  /consent/documents/{documentId}/content:
    $ref: './paths/consent.yaml#/~1consent~1documents~1{documentId}~1content'
  /consent/acceptances:
    $ref: './paths/consent.yaml#/~1consent~1acceptances'
  /consent/withdrawals:
    $ref: './paths/consent.yaml#/~1consent~1withdrawals'
  /consent/status:
    $ref: './paths/consent.yaml#/~1consent~1status'
  /platform/bootstrap:
    $ref: './paths/platform.yaml#/~1platform~1bootstrap'
  /platform/tenant-binding:
    $ref: './paths/platform.yaml#/~1platform~1tenant-binding'
  # What a caller may declare, derived from the same predicate the write path
  # enforces, so the offered set and the accepted set cannot drift apart.
  /jurisdiction/declarable-references:
    $ref: './paths/jurisdiction.yaml#/~1jurisdiction~1declarable-references'
  /jurisdiction/self-declaration:
    $ref: './paths/jurisdiction.yaml#/~1jurisdiction~1self-declaration'
  # ---------------------------------------------------------------------------
  # Phase 5 — the financial surface, self-scoped throughout.
  #
  # Every operation below acts for the AUTHENTICATED principal and nobody
  # else. There is no `userId` and no `tenantId` on any of them — not in a
  # path, a query, a header, or a body — and no operation reads, writes, or
  # confirms the existence of another subject's financial data. Another
  # subject's id answers 404, the same answer an unknown id gets.
  #
  # Two rails run: MANUAL and USER_FILE_UPLOAD. Every response that names a
  # rail also states its availability, and nothing on this surface can be
  # rendered as "Connected" — no issuer exposes an interface to this platform
  # and no credential of any kind is stored (ADR-0028).
  #
  # DELIBERATELY NOT MERGED, and each absence is a decision rather than an
  # oversight:
  #   * account DELETION. The cross-module cascade is not atomic and the
  #     contract for reporting a partial outcome has not been chosen; an
  #     operation that might mean "some of it" is worse than none.
  #   * institution MARKET presence. The table exists (migration 0094) and the
  #     module declares no reader for it; a path answering from nothing would
  #     be a false claim.
  #   * a statement-import MAPPING update. There is no stored draft mapping —
  #     the mapping is an argument to the parse — so an endpoint that appeared
  #     to save one would change nothing.
  #   * transfer-match SUGGESTION as a client verb, and every payment-instrument
  #     and connection WRITE. Their contracts are unresolved; the read surface
  #     stands alone until they are.
  /financial/institutions:
    $ref: './paths/financial-accounts.yaml#/~1financial~1institutions'
  /financial/accounts:
    $ref: './paths/financial-accounts.yaml#/~1financial~1accounts'
  /financial/accounts/{accountId}:
    $ref: './paths/financial-accounts.yaml#/~1financial~1accounts~1{accountId}'
  /financial/accounts/{accountId}/balances:
    $ref: './paths/financial-accounts.yaml#/~1financial~1accounts~1{accountId}~1balances'
  # Which source feeds this account and how fresh it is — the SAFE projection,
  # with the external account reference and its keyed fingerprint absent by
  # construction rather than by filtering.
  /financial/accounts/{accountId}/source-links:
    $ref: './paths/financial-connections.yaml#/~1financial~1accounts~1{accountId}~1source-links'
  /financial/accounts/{accountId}/payment-instruments:
    $ref: './paths/financial-payment-instruments.yaml#/~1financial~1accounts~1{accountId}~1payment-instruments'
  /financial/connections:
    $ref: './paths/financial-connections.yaml#/~1financial~1connections'
  /financial/transactions:
    $ref: './paths/financial-transactions.yaml#/~1financial~1transactions'
  /financial/transactions/{transactionId}:
    $ref: './paths/financial-transactions.yaml#/~1financial~1transactions~1{transactionId}'
  /financial/transactions/{transactionId}/category:
    $ref: './paths/financial-transactions.yaml#/~1financial~1transactions~1{transactionId}~1category'
  /financial/transactions/{transactionId}/provenance:
    $ref: './paths/financial-transactions.yaml#/~1financial~1transactions~1{transactionId}~1provenance'
  /financial/categories:
    $ref: './paths/financial-transactions.yaml#/~1financial~1categories'
  /financial/statement-imports:
    $ref: './paths/financial-statement-imports.yaml#/~1financial~1statement-imports'
  /financial/statement-imports/{importId}:
    $ref: './paths/financial-statement-imports.yaml#/~1financial~1statement-imports~1{importId}'
  /financial/statement-imports/{importId}/source:
    $ref: './paths/financial-statement-imports.yaml#/~1financial~1statement-imports~1{importId}~1source'
  /financial/statement-imports/{importId}/parse:
    $ref: './paths/financial-statement-imports.yaml#/~1financial~1statement-imports~1{importId}~1parse'
  /financial/statement-imports/{importId}/preview:
    $ref: './paths/financial-statement-imports.yaml#/~1financial~1statement-imports~1{importId}~1preview'
  /financial/statement-imports/{importId}/commit:
    $ref: './paths/financial-statement-imports.yaml#/~1financial~1statement-imports~1{importId}~1commit'
  /financial/transfer-matches:
    $ref: './paths/financial-transfer-matching.yaml#/~1financial~1transfer-matches'
  /financial/transfer-matches/{matchId}/confirmation:
    $ref: './paths/financial-transfer-matching.yaml#/~1financial~1transfer-matches~1{matchId}~1confirmation'
  /financial/transfer-matches/{matchId}/rejection:
