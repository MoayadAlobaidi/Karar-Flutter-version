# Authored by hand, never generated from code (ADR-0009).
# Endpoints are designed in per-module fragments under paths/ and merged here
# by the phase lead via $ref (JSON Pointer, `/` escaped as `~1`). The
# operating-entity fragment is CONTRACT-ONLY in Phase 3: its admin surface
# mounts behind the control-plane gateway when that phase lands (ADR-0021),
# so its paths are deliberately NOT merged yet — an unimplemented path in
# this document would be a false claim.
openapi: 3.1.0
info:
  title: Karar API
  version: 0.6.0
  description: >-
    Contract-first API surface for the Karar platform. Phase 3 exposes
    authentication and session lifecycle (identity), own-profile management
    (users), tenant membership and invitations (tenancy), and consumer
    consent (consent). SDKs are generated from this file and committed.
    Tenant-bound endpoints (users, tenancy except invitation redemption,
    consent) require the session to carry a server-side tenant binding.
    Phase 3.5 supplies it: GET /platform/bootstrap binds automatically when
    the caller has exactly one active membership and otherwise reports the
    selection state, and POST /platform/tenant-binding binds or switches
    explicitly. A session that is still unbound reaches no tenant-scoped
    endpoint.

    Phase 5 adds the FINANCIAL surface under /financial: the reviewed issuer
    and category catalogues, the caller's own accounts and wallets, their
    source-reported balances, their transactions with revision history and
    provenance, the safe summaries of how their data arrives and what spends
    from it, CSV statement ingestion, and transfer matching. Every one of
    those operations is SELF-SCOPED: the subject and the tenant come from the
    session's server-side binding, and no operation anywhere accepts a userId
    or a tenantId. Money is an exact minor-unit string with its currency,
    never a JSON number; a booking or value date is a calendar day and a true
    instant is a date-time (ADR-0027). Only MANUAL and USER_FILE_UPLOAD are
    executable rails, every rail-bearing response says so, and nothing on the
    surface may be rendered as a live institution link.
paths:
