  /auth/forgot-password:
    $ref: './paths/identity.yaml#/~1auth~1forgot-password'
  /auth/reset-password:
    $ref: './paths/identity.yaml#/~1auth~1reset-password'
  /auth/change-password:
    $ref: './paths/identity.yaml#/~1auth~1change-password'
  /auth/mfa/enroll:
    $ref: './paths/identity.yaml#/~1auth~1mfa~1enroll'
  /auth/mfa/confirm:
