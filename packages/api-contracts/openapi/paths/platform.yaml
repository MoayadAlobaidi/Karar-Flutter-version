# platform bootstrap surface — path-item fragments (ADR-0009: authored by
# hand, never generated from code). The phase lead merges these into
# openapi.yaml via $ref per path, e.g.:
#   /platform/bootstrap:
#     $ref: './paths/platform.yaml#/~1platform~1bootstrap'
#
# Contract rules made visible here:
#   * Tenant identity comes ONLY from the authenticated session's server-side
#     binding. GET consults no query, header, or body value at all; POST reads
#     exactly ONE body field — tenantId — and only as a SELECTION among the
#     caller's own server-verified active memberships, never as a principal.
#     A `?tenantId=` or `x-tenant-id` header is ignored everywhere, by
#     construction (asserted by test).
#   * The bootstrap response carries CLIENT-SAFE data only: capability output
#     arrives pre-filtered from the client-safe resolver (hidden capabilities
#     never appear in any state), PolicyPack is version/status only (never
#     content), the operating entity is the reviewed safe projection (never
#     licence details, registration numbers, contracting capacity, entity
#     status, or controller/processor analysis), and the serializer emits a
#     closed field set (leak-regression tested).
#   * ABSENCE AND FAILURE ARE DIFFERENT ANSWERS. A resolution that succeeded
#     with nothing to report is a 200 carrying an explicit state (capabilities
#     `state: RESOLVED` with an empty `items`; jurisdiction `NONE`; policyPack
#     null; operatingEntity `UNASSIGNED`). A resolution that could not be
#     PERFORMED is a 503 (code BOOTSTRAP_UNAVAILABLE) — never a 200 whose
#     empty sections would read as a legitimate absence. The single exception
#     is the operating-entity read, whose failure degrades that section alone
#     to state `UNAVAILABLE` because the rest of the context is complete
#     without it.
#   * No admin write endpoints exist on this surface.

/platform/bootstrap:
  get:
    operationId: getPlatformBootstrap
    summary: The authenticated client's bootstrap context
    description: >-
      Returns the caller's user/session context, tenant-binding state,
      jurisdiction assignment and verification status, operating-entity
      reference, PolicyPack version/status, and client-visible capabilities
      with actionable requirements.

      SIDE EFFECT (documented on purpose): when the session is UNBOUND and
      the caller holds EXACTLY ONE active membership in an active tenant,
      this endpoint AUTO-BINDS the session to that tenant before answering
      (no token rotation — existing tokens keep working and pick the binding
      up server-side). The auto-bind is audited. With zero usable
      memberships the state is UNBOUND; with several it is
      TENANT_SELECTION_REQUIRED and binding requires an explicit
      POST /platform/tenant-binding.
    tags: [platform]
    security:
      - sessionAuth: []
    responses:
      '200':
        description: The bootstrap context for the authenticated session.
        content:
          application/json:
            schema:
              $ref: '#/components/BootstrapContext'
      '401':
        $ref: '#/components/ProblemResponse'
      '503':
        description: >-
          A context resolution could not be PERFORMED — tenant-context
          resolution, the audit append, the jurisdiction assignment read, the
          PolicyPack activation ledger, or capability resolution (code
          BOOTSTRAP_UNAVAILABLE, one code for one remedy). This is NOT the
          same answer as an empty result: a successful resolution with nothing
          to report is a 200. The document carries `retryable` and, when the
          caller supplied one, `requestId`; it deliberately carries no detail,
          no capability identifiers, no policy or licence internals, and no
          store text.
        content:
          application/problem+json:
            schema:
              $ref: '#/components/Problem'

/platform/tenant-binding:
  post:
    operationId: setPlatformTenantBinding
    summary: Bind the session to a tenant, or switch it to another
    description: >-
      Explicit tenant selection. The body's tenantId is a CHOICE among the
      caller's own active memberships — the server verifies an ACTIVE
      membership in an ACTIVE tenant before any binding changes, and an
      arbitrary, revoked, expired, or disabled-tenant target is refused
      (403, code MEMBERSHIP_REQUIRED) without revealing whether the tenant
      exists.

      UNBOUND session: FIRST BIND — the session gains the tenant binding with
      NO token rotation; the response is the bound bootstrap-shaped binding
      state (kind BOUND, no tokens).

      BOUND session: SWITCH — the current session and its refresh-token
      families are revoked atomically and a BRAND-NEW session bound to the
      target is issued; the response (kind SWITCHED) carries the NEW access
      and refresh tokens, and every prior token is dead. If the target
      membership is revoked concurrently with the switch, the replacement
      session is revoked too (409, code MEMBERSHIP_REVOKED_CONCURRENTLY) —
      the caller signs in again; a session is never left bound without
      membership.
    tags: [platform]
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [tenantId]
            properties:
              tenantId:
                type: string
                format: uuid
                description: >-
                  The selected tenant — must be one of the caller's own
                  active memberships; verified server-side, never trusted.
    responses:
      '200':
        description: Binding changed.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/TenantBound'
                - $ref: '#/components/TenantSwitched'
              discriminator:
                propertyName: kind
      '400':
        description: Malformed body (code INVALID_TENANT_SELECTION).
        content:
          application/problem+json:
            schema:
              $ref: '#/components/Problem'
      '401':
        $ref: '#/components/ProblemResponse'
      '403':
        description: >-
          No active membership in the requested tenant (code
          MEMBERSHIP_REQUIRED — uniform for arbitrary, revoked, expired, and
          disabled-tenant targets).
        content:
          application/problem+json:
            schema:
              $ref: '#/components/Problem'
      '409':
        description: >-
          The binding changed under the caller (codes BINDING_CONFLICT,
          MEMBERSHIP_REVOKED_CONCURRENTLY). Re-authenticate or retry
          bootstrap.
        content:
          application/problem+json:
            schema:
              $ref: '#/components/Problem'
      '503':
        $ref: '#/components/ProblemResponse'

# Local component shapes for this fragment; the lead may lift them into the
# root document's components section when merging.
components:
  BootstrapContext:
    type: object
    required: [user, session, binding, jurisdiction, operatingEntity, policyPack, capabilities]
    properties:
      user:
        type: object
        required: [userId, emailVerified]
        properties:
          userId:
            type: string
            format: uuid
          emailVerified:
            type: boolean
      session:
        type: object
        required: [sessionId]
        properties:
          sessionId:
            type: string
            format: uuid
      binding:
        $ref: '#/components/BindingState'
      jurisdiction:
        type: object
        required: [state, jurisdictionId]
        properties:
          state:
            type: string
            enum: [NONE, UNVERIFIED, VERIFIED]
            description: >-
              The typed, fail-closed effective-jurisdiction state. Clients key
              on THIS, never on the identifier — behaviour differences resolve
              through policy packs, not through country branches. NONE is the
              unresolved case (no assignment).
          jurisdictionId:
            type: [string, 'null']
            description: >-
              The assigned jurisdiction as DATA (display, pack selection);
              null when the state is NONE.
      operatingEntity:
        $ref: '#/components/OperatingEntityState'
      policyPack:
        oneOf:
          - type: 'null'
          - type: object
            required: [version, status]
            properties:
              version:
                type: string
              status:
                type: string
        description: >-
          Version and status only — never pack content. Null means no pack is
          active for the resolved jurisdiction; a ledger that could not be
          read answers 503 instead, never null.
      capabilities:
        $ref: '#/components/CapabilitiesSection'
  BindingState:
    oneOf:
      - type: object
        required: [kind]
        properties:
          kind:
            type: string
            enum: [UNBOUND]
      - type: object
        required: [kind, tenant]
        properties:
          kind:
            type: string
            enum: [BOUND]
          tenant:
            $ref: '#/components/TenantChoice'
      - type: object
        required: [kind, choices]
        properties:
          kind:
            type: string
            enum: [TENANT_SELECTION_REQUIRED]
          choices:
            type: array
            items:
              $ref: '#/components/TenantChoice'
    discriminator:
      propertyName: kind
  TenantChoice:
    type: object
    required: [tenantId, name, roleHint]
    properties:
      tenantId:
        type: string
        format: uuid
      name:
        type: string
      roleHint:
        type: string
        description: Informational only — authoritative roles live in the authorization module.
  OperatingEntityState:
    type: object
    required: [state, entity]
    description: >-
      Which legal person the caller contracted with, as a STATE plus the
      reviewed safe projection. ASSIGNED carries the entity; UNASSIGNED means
      no binding exists; UNAVAILABLE means the read failed and the reference
      is not known. The entity is never fabricated, and `entity` is explicitly
      null (not omitted) in both absent states.
    properties:
      state:
        type: string
        enum: [ASSIGNED, UNASSIGNED, UNAVAILABLE]
      entity:
        oneOf:
          - type: 'null'
          - $ref: '#/components/OperatingEntitySummary'
  OperatingEntitySummary:
    type: object
    required: [id, name, jurisdictionRef, contactReference]
    description: >-
      The reviewed safe field set. Deliberately absent and never to be added:
      licence records and evidence references, registration numbers and other
      register internals, contracting capacity, controller/processor legal
      analysis, data-protection role assignments, entity status, and
      administrative timestamps.
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
        description: >-
          The registered legal name — the register holds no separate trading
          name, and none is invented.
      jurisdictionRef:
        type: [string, 'null']
        description: >-
          The regime the entity is registered in, as DATA for display. Clients
          never branch on it (architecture test 12).
      contactReference:
        type: [string, 'null']
        description: >-
          A published role-mailbox reference for data-protection contact, where
          the register carries one. Never a named person.
  CapabilitiesSection:
    type: object
    required: [state, items]
    description: >-
      The resolution STATE and the list, structurally inseparable. A 200 always
      carries state RESOLVED, so an EMPTY `items` is a stated answer rather
      than something the client must infer; a resolution that failed answers
      503 and never reaches this shape.
    properties:
      state:
        type: string
        enum: [RESOLVED]
      items:
        type: array
        description: >-
          CLIENT-SAFE capability views, passed through from the client-safe
          resolver unenriched. Hidden capabilities never appear, in any
          state; requirements are actionable only.
        items:
          $ref: '#/components/CapabilityView'
  CapabilityView:
    type: object
    required: [id, status, requirements]
    properties:
      id:
        type: string
      status:
        type: string
      requirements:
        type: array
        items:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
            detail:
              type: string
  TenantBound:
    type: object
    required: [kind, binding]
    properties:
      kind:
        type: string
        enum: [BOUND]
      binding:
        $ref: '#/components/BindingState'
  TenantSwitched:
    type: object
    required: [kind, binding, tokens]
    properties:
      kind:
        type: string
        enum: [SWITCHED]
      binding:
        $ref: '#/components/BindingState'
      tokens:
        type: object
        required:
          [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, sessionId]
        properties:
          accessToken:
            type: string
          accessTokenExpiresAt:
            type: string
            format: date-time
          refreshToken:
            type: string
            description: The NEW refresh token — every prior token is dead.
          refreshTokenExpiresAt:
            type: string
            format: date-time
          sessionId:
            type: string
            format: uuid
  Problem:
    type: object
    required: [type, title, status, code]
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
      code:
        type: string
        description: >-
          Machine-readable reason (e.g. AUTHENTICATION_REQUIRED,
          MEMBERSHIP_REQUIRED, BINDING_CONFLICT,
          MEMBERSHIP_REVOKED_CONCURRENTLY, BOOTSTRAP_UNAVAILABLE).
      detail:
        type: string
      reason:
        type: string
      retryable:
        type: boolean
        description: >-
          Present where retrying is meaningful (the 503 path): true for a
          transient dependency fault, false where a retry cannot change the
          answer. Absent rather than guessed.
      requestId:
        type: string
        description: >-
          The caller's own request correlation id, echoed so a client-reported
          failure joins to the server-side log line that holds the cause. The
          cause itself never crosses the edge.
  ProblemResponse:
    description: RFC 7807 problem document.
    content:
      application/problem+json:
        schema:
          $ref: '#/components/Problem'
