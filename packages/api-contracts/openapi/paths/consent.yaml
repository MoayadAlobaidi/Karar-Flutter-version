# consent surface (§49) — path-item fragments (ADR-0009: authored by hand,
# never generated from code). The phase lead merges these into openapi.yaml
# via $ref per path, e.g.:
#   /consent/status:
#     $ref: './paths/consent.yaml#/~1consent~1status'
#
# Contract rules made visible here:
#   * Every operation acts for the AUTHENTICATED principal and nobody else.
#     No operation accepts a userId or tenantId — not in query, header, or
#     body; the subject is the session's subject. There is deliberately no
#     accept-on-behalf-of operation anywhere in this surface
#     (modules/consent/MODULE.md, permissions deliberately absent).
#   * A grant pins (operatingEntity, purpose, jurisdiction) and the exact
#     accepted version at creation (ADR-0024); withdrawal preserves the row;
#     re-granting creates a new one.
#   * Status fails closed: NO_GRANT, WITHDRAWN, and RECONSENT_REQUIRED all
#     deny processing; only ACTIVE permits it. RECONSENT_REQUIRED appears
#     when the effective published version is MATERIAL_REACCEPTANCE_REQUIRED
#     and newer than the granted version.
#   * Errors are RFC 7807 problem documents with a machine-readable `code`.

/consent/documents:
  get:
    operationId: listApplicableConsentDocuments
    summary: List the legal documents applicable to the caller, with their effective versions
    description: >-
      Documents for the operating entity effective for the caller (user
      contracting binding first, tenant default second), each with its
      currently effective published version. A document without an effective
      version has nothing to accept yet.
    tags: [consent]
    security:
      - sessionAuth: []
    parameters:
      - name: jurisdictionRef
        in: query
        required: false
        schema: { type: string }
        description: Restrict to one jurisdiction reference.
    responses:
      '200':
        description: The applicable documents.
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    required:
                      [documentId, entityId, jurisdictionRef, purposeRefs, kind, effectiveVersion]
                    properties:
                      documentId: { type: string, format: uuid }
                      entityId: { type: string, format: uuid }
                      jurisdictionRef: { type: string }
                      purposeRefs:
                        type: array
                        items: { type: string }
                      kind: { type: string }
                      effectiveVersion:
                        type: [object, 'null']
                        required: [versionId, version, contentHash, classification, effectiveAt]
                        additionalProperties: false
                        properties:
                          versionId: { type: string, format: uuid }
                          version: { type: string }
                          contentHash:
                            type: string
                            description: >-
                              sha256 of the canonical document bytes. The
                              content route serves only bytes that match it, so
                              a client may re-check what it displayed against
                              what it later accepts.
                          classification:
                            type: [string, 'null']
                            enum:
                              [
                                MATERIAL_REACCEPTANCE_REQUIRED,
                                NOTICE_REQUIRED,
                                NO_USER_ACTION_REQUIRED,
                                null,
                              ]
                          effectiveAt: { type: [string, 'null'], format: date-time }
      '401': { description: Not authenticated. }
      '409': { description: No operating entity is bound for the caller — consent fails closed. }

/consent/documents/{documentId}/content:
  get:
    operationId: readConsentDocumentContent
    summary: Read the text of the document version in force, with its language
    description: >-
      The legal text a subject must READ before accepting, supplied by the
      platform. The client never composes, summarizes, translates, or
      substitutes legal wording; when the platform has no content to serve this
      route says so and the client shows its own unavailable state.

      The caller names a DOCUMENT, never a version: the server chooses the
      version in force, so no unpublished draft and no superseded version is
      reachable. The document must be the one applicable to the caller (the
      effective operating entity is resolved server-side); any other entity's
      document answers 404, exactly as an unknown id does, so the route is not
      an oracle for the wider catalogue.

      WHAT IS SERVED IS WHAT WAS PUBLISHED. The bytes are hashed and compared
      against the version's pinned `contentHash` before anything is returned; a
      mismatch is refused (503) rather than displayed with a warning, because a
      grant pins a version id and reading one text while accepting another is
      the failure this check exists to prevent.

      `language` describes the CONTENT and arrives with it. The catalogue
      records no language, so the listing carries none — a language field there
      could only be invented.
    tags: [consent]
    security:
      - sessionAuth: []
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: The version in force, its content, and the content's language.
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  documentId,
                  versionId,
                  version,
                  contentHash,
                  effectiveAt,
                  language,
                  format,
                  content,
                ]
              additionalProperties: false
              properties:
                documentId: { type: string, format: uuid }
                versionId:
                  type: string
                  format: uuid
                  description: The exact version displayed — post this to /consent/acceptances.
                version: { type: string }
                contentHash:
                  type: string
                  description: sha256 the served bytes were verified against.
                effectiveAt: { type: [string, 'null'], format: date-time }
                language:
                  type: string
                  description: >-
                    BCP-47 tag of the text, as the content source recorded it.
                    Never inferred; content whose language cannot be stated is
                    not served.
                format:
                  type: string
                  enum: [text/plain, text/markdown]
                content:
                  type: string
                  description: >-
                    The document text, server-supplied. No internal storage
                    locator appears anywhere in this response.
      '401': { description: Not authenticated. }
      '404':
        description: >-
          No legal document with that id applies to this caller (code
          DOCUMENT_NOT_FOUND) — the same answer an unknown id and another
          entity's document receive.
        content:
          application/problem+json:
            schema:
              $ref: '#/components/Problem'
      '409':
        description: >-
          No operating entity is bound for the caller (code
          NO_EFFECTIVE_ENTITY), or the document EXISTS and applies but the
          platform has no displayable text for it (code
          DOCUMENT_CONTENT_UNAVAILABLE, with `reason` NO_EFFECTIVE_VERSION |
          NOT_RETRIEVABLE | LANGUAGE_NOT_STATED). Deliberately not a 404: the
          document is still owed consent, and a client told it was gone would
          stop asking.
        content:
          application/problem+json:
            schema:
              $ref: '#/components/Problem'
      '503':
        description: >-
          The retrieved content did not match the published version (code
          DOCUMENT_CONTENT_UNVERIFIABLE — nothing was served), or the catalogue
          did not answer (code STORE_UNAVAILABLE).
        content:
          application/problem+json:
            schema:
              $ref: '#/components/Problem'

/consent/acceptances:
  post:
    operationId: recordOwnConsentAcceptance
    summary: Record the caller's OWN acceptance of a published document version
    description: >-
      Creates an immutable consent grant pinned to the document's operating
      entity, jurisdiction, the named purpose, and the exact accepted version
      (ADR-0024). Any prior ACTIVE grant for the same triple is marked
      SUPERSEDED in the same transaction. The evidence reference is derived
      from the request identity server-side, never accepted from the client.
    tags: [consent]
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [legalDocumentVersionId, purposeRef]
            properties:
              legalDocumentVersionId: { type: string, format: uuid }
              purposeRef: { type: string }
    responses:
      '201':
        description: The recorded grant.
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  grantId,
                  operatingEntityId,
                  purposeRef,
                  jurisdictionRef,
                  consentVersion,
                  legalDocumentVersionId,
                  grantedAt,
                  status,
                ]
              properties:
                grantId: { type: string, format: uuid }
                operatingEntityId: { type: string, format: uuid }
                purposeRef: { type: string }
                jurisdictionRef: { type: string }
                consentVersion: { type: string }
                legalDocumentVersionId: { type: string, format: uuid }
                grantedAt: { type: string, format: date-time }
                status: { type: string, enum: [ACTIVE] }
      '400':
        description: >-
          Unpublished version, purpose not covered by the document, or the
          document belongs to an entity that is not effective for the caller
          (consent to Entity A is not consent to Entity B).
      '401': { description: Not authenticated. }
      '404': { description: Unknown document version. }
      '409': { description: No operating entity is bound for the caller — consent fails closed. }
      '503':
        description: >-
          Policy provenance is unresolved, so the grant is not recorded
          (code DEPENDENCY_UNAVAILABLE). From Phase 3.5 a grant must pin the
          PolicyPack version it was accepted under (migration 0086), and the
          schema refuses an unpinned row independently. This is returned
          whenever the caller has no effective jurisdiction assignment or no
          pack is active for it — which, in Phase 3.5, is every caller:
          neither record has a runtime write path yet, so consent acceptance
          is unreachable until one exists. Refusing is the intended
          behaviour; recording a grant whose provenance nobody resolved is
          not.

/consent/withdrawals:
  post:
    operationId: withdrawOwnConsent
    summary: Withdraw the caller's OWN consent grant
    description: >-
      Sets withdrawn_at and status WITHDRAWN on the caller's own ACTIVE
      grant. The row is preserved as evidence; re-granting later creates a
      NEW grant. Another subject's grant id is indistinguishable from an
      unknown one (404) — row-level security scopes the lookup.
    tags: [consent]
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [grantId]
            properties:
              grantId: { type: string, format: uuid }
    responses:
      '200':
        description: The withdrawn grant.
        content:
          application/json:
            schema:
              type: object
              required: [grantId, status, withdrawnAt]
              properties:
                grantId: { type: string, format: uuid }
                status: { type: string, enum: [WITHDRAWN] }
                withdrawnAt: { type: string, format: date-time }
      '401': { description: Not authenticated. }
      '404': { description: Unknown grant — including any grant that is not the caller's own. }
      '409': { description: The grant is not ACTIVE (already withdrawn or superseded). }

/consent/status:
  get:
    operationId: readOwnConsentStatus
    summary: Read the caller's OWN consent status for a purpose
    description: >-
      Resolves the caller's consent for (purpose, jurisdiction?) against the
      operating entity effective for them. States: ACTIVE (processing
      permitted; noticeRequired flags a pending NOTICE_REQUIRED
      republication), WITHDRAWN, RECONSENT_REQUIRED (a newer
      MATERIAL_REACCEPTANCE_REQUIRED version is in force — fails closed), and
      NO_GRANT (no acceptance, or no published document — fails closed).
    tags: [consent]
    security:
      - sessionAuth: []
    parameters:
      - name: purposeRef
        in: query
        required: true
        schema: { type: string }
      - name: jurisdictionRef
        in: query
        required: false
        schema: { type: string }
        description: Required only when documents in several jurisdictions cover the purpose.
    responses:
      '200':
        description: The resolved status.
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  state,
                  noticeRequired,
                  purposeRef,
                  jurisdictionRef,
                  operatingEntityId,
                  documentId,
                  grantId,
                  grantedVersion,
                  effectiveVersionId,
                  effectiveVersion,
                ]
              properties:
                state:
                  type: string
                  enum: [ACTIVE, WITHDRAWN, RECONSENT_REQUIRED, NO_GRANT]
                noticeRequired: { type: boolean }
                purposeRef: { type: string }
                jurisdictionRef: { type: [string, 'null'] }
                operatingEntityId: { type: string, format: uuid }
                documentId: { type: [string, 'null'], format: uuid }
                grantId: { type: [string, 'null'], format: uuid }
                grantedVersion: { type: [string, 'null'] }
                effectiveVersionId: { type: [string, 'null'], format: uuid }
                effectiveVersion: { type: [string, 'null'] }
      '400': { description: Ambiguous jurisdiction — name one. }
      '401': { description: Not authenticated. }
      '409': { description: No operating entity is bound for the caller — consent fails closed. }

# Local component shapes for this fragment; the lead may lift them into the
# root document's components section when merging. Only the content route
# references them today — the older §49 routes describe their failures in
# prose, and normalizing those is a separate, contract-wide change.
components:
  Problem:
    type: object
    required: [type, title, status, code]
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
      code:
        type: string
        description: >-
          Machine-readable reason (DOCUMENT_NOT_FOUND, NO_EFFECTIVE_ENTITY,
          DOCUMENT_CONTENT_UNAVAILABLE, DOCUMENT_CONTENT_UNVERIFIABLE,
          STORE_UNAVAILABLE).
      detail:
        type: string
      reason:
        type: string
        description: >-
          Finer-grained reason where applicable — on
          DOCUMENT_CONTENT_UNAVAILABLE it is NO_EFFECTIVE_VERSION,
          NOT_RETRIEVABLE, or LANGUAGE_NOT_STATED.
