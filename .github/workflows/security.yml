# Security scanning for the Karar V2 monorepo.
#
# Job inventory (blocking = should be a required status check on main):
#   codeql             blocking     static analysis (JS/TS), results in code scanning
#   secrets            blocking     gitleaks full-history secret scan
#   dependency-review  blocking     PR-only review of newly introduced dependencies
#   dependency-audit   report-only  pnpm audit; tightening criterion tracked in
#                                   docs/operations/repository-security-settings.md
#   iac-and-containers blocking     trivy misconfiguration scan, gates on HIGH/CRITICAL
#   sbom               blocking     SPDX SBOM generation (artifact: sbom)
#   licenses           report-only  license inventory (artifact: licenses)
#   mobile-supply-chain report-only Flutter/Dart dependency report and mobile
#                                   SBOM (artifacts: mobile-dependency-audit,
#                                   mobile-sbom), plus a mobile secret scan
#
# Every action is pinned to a commit SHA. No cloud (GCP/AWS) credentials are
# used anywhere in this workflow; the only secret is the read-only GITHUB_TOKEN.
#
# WHERE MOBILE SECRET SCANNING HAPPENS, AND WHY IN MORE THAN ONE PLACE
#   1. `secrets` (this workflow) — gitleaks over the full git history of the
#      whole repository, apps/mobile included. Catches a credential that was
#      committed and later removed.
#   2. The Dart security suite inside the required `mobile` check in ci.yml —
#      the working tree, with rules specific to this product.
#   3. `mobile-android` in ci.yml — the built APK, which is what would actually
#      be distributed and which no source scan can see.
#   4. `mobile-supply-chain` below — apps/mobile, in shell, with no dependency
#      on the Flutter toolchain resolving. (2) silently stops running if the
#      mobile package fails to compile; this one does not, which is the reason
#      it is kept separate rather than trusting a single scanner.

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: read-only token by default; jobs that upload SARIF elevate
# security-events only.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Cancel superseded runs on PRs only; never cancel in-flight main builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload analysis results to code scanning
      actions: read # required by codeql-action on private repositories
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          category: '/language:javascript-typescript'

  gitleaks:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone: gitleaks scans every commit, not just HEAD. A shallow
          # clone would miss secrets that were committed and later removed.
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The workflow token is read-only by design; PR comments would need
          # pull-requests: write, so they stay disabled.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # If this repository moves into a GitHub organization, gitleaks-action
          # requires a GITLEAKS_LICENSE repository secret (free for personal
          # accounts). See docs/operations/repository-security-settings.md.

  dependency-review:
    name: dependency-review
    # The action diffs dependency manifests between base and head, so it only
    # exists on pull_request events; it is skipped (not failed) on push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Blocking gate, aligned with the `pnpm audit --audit-level high` policy.
          fail-on-severity: high

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from "packageManager" in package.json)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - name: pnpm audit (report-only)
        # Report-only for now: continue-on-error keeps the job green while the
        # advisory baseline is established, but the step still shows a failure
        # annotation when high-severity advisories exist. The tightening
        # criterion and owner are recorded in
        # docs/operations/repository-security-settings.md.
        continue-on-error: true
        run: |
          mkdir -p reports
          # pnpm audit reads pnpm-lock.yaml; no install needed.
          set +e
          pnpm audit --audit-level high --json > reports/dependency-audit.json
          status=$?
          set -e
          # Human-readable copy for the job log; exit status comes from the JSON run.
          pnpm audit --audit-level high || true
          exit "$status"

      - name: Upload audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: reports/dependency-audit.json
          if-no-files-found: warn

  iac-and-containers:
    name: iac-and-containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy config scan (SARIF)
        # First pass produces SARIF for code scanning and always succeeds;
        # the blocking gate is the severity-filtered pass below.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Upload SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iac-scan-report
          path: trivy-config.sarif
          if-no-files-found: warn

      - name: Trivy config gate (HIGH/CRITICAL)
        # Blocking on high/critical misconfigurations in docker-compose,
        # Dockerfiles, and other IaC; lower severities are visible in code
        # scanning but do not fail CI.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Container image scan status
        # No container images are built in CI yet, so there is nothing to scan
        # with scan-type: image. This step exists so the gap is explicit instead
        # of silently absent; activate an image scan when image builds land.
        run: |
          echo "No container images are built in CI yet."
          echo "When image builds land, add a trivy image scan (scan-type: image) against the built tags."

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false # uploaded below under the stable artifact name "sbom"
          dependency-snapshot: false # the submission API needs contents: write; token stays read-only

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  # Supply-chain reporting for the Flutter client.
  #
  # Report-only, matching how `dependency-audit` and `licenses` treat the Node
  # workspace: there is no advisory baseline for the pub ecosystem yet, and a
  # gate without a baseline blocks on noise. The tightening criterion belongs
  # beside the existing ones in
  # docs/operations/repository-security-settings.md.
  #
  # The secret scan in this job is NOT report-only. It fails the job.
  mobile-supply-chain:
    name: mobile-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs before the toolchain is set up, deliberately: this scan must not
      # depend on Flutter resolving. See the header for why.
      - name: Mobile secret scan (blocking)
        run: |
          set -uo pipefail
          root=apps/mobile
          findings=0

          scan() {
            local rule="$1" pattern="$2"
            local hits
            hits="$(grep -rInE --binary-files=without-match \
                      --exclude-dir=build \
                      --exclude-dir=.dart_tool \
                      --exclude-dir=.gradle \
                      --exclude-dir=Pods \
                      --exclude-dir=ephemeral \
                      "$pattern" "$root" 2>/dev/null || true)"
            if [ -n "$hits" ]; then
              echo "FAIL [$rule]"
              echo "$hits"
              findings=1
            fi
          }

          # Shapes that are never legitimate. The mirror of the rule table in
          # apps/mobile/test/security/embedded_secrets_test.dart; the two are
          # intentionally duplicated so neither is a single point of failure.
          scan private-key-block '\-\-\-\-\-BEGIN [A-Z ]*PRIVATE KEY\-\-\-\-\-'
          scan service-account-document '"type"[[:space:]]*:[[:space:]]*"service_account"'
          scan database-credentials '(postgres|postgresql|mysql|mongodb|redis|amqp)://[^[:space:]:@/"]+:[^[:space:]@/"]+@'
          scan aws-access-key-id 'AKIA[0-9A-Z]{16}'
          scan google-api-key 'AIza[0-9A-Za-z_-]{35}'
          scan cloudflare-api-token 'v1\.0-[A-Za-z0-9_-]{20,}'
          scan github-token 'gh[pousr]_[A-Za-z0-9]{36}'
          scan slack-token 'xox[baprs]-[0-9A-Za-z-]{10,}'
          scan stripe-secret-key 'sk_(live|test)_[A-Za-z0-9]{16,}'
          scan json-web-token '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

          # Signing and provider credential files, which must be supplied
          # externally at release time and never committed.
          tracked="$(git ls-files "$root" \
            | grep -Ei '\.(jks|keystore|p12|pfx|pem|key|cer|crt|der|mobileprovision|provisionprofile)$|(^|/)(google-services\.json|GoogleService-Info\.plist|key\.properties)$' \
            || true)"
          if [ -n "$tracked" ]; then
            echo "FAIL [committed-signing-or-provider-credential]"
            echo "$tracked"
            findings=1
          fi

          if [ "$findings" -ne 0 ]; then
            echo "Mobile secret scan found credential material."
            exit 1
          fi
          echo "OK: mobile secret scan clean."

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Resolve packages
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Dart dependency report (report-only)
        working-directory: apps/mobile
        continue-on-error: true
        run: |
          mkdir -p ../../reports
          dart pub outdated --json > ../../reports/mobile-dependency-audit.json
          # Human-readable copy for the job log.
          dart pub outdated || true

      - name: Upload dependency report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-dependency-audit
          path: reports/mobile-dependency-audit.json
          if-no-files-found: warn

      # A mobile-scoped SBOM. The repository-wide `sbom` job runs syft over the
      # whole tree and does catalogue pubspec.lock, but its output is one
      # document covering everything. A store submission, a customer security
      # questionnaire and a vulnerability triage all want the client's
      # dependencies on their own, so this produces that separately rather than
      # asking the consumer to filter the monorepo SBOM.
      - name: Generate mobile SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: apps/mobile
          format: spdx-json
          output-file: mobile-sbom.spdx.json
          upload-artifact: false # uploaded below under a stable artifact name
          dependency-snapshot: false # the submission API needs contents: write

      - name: Upload mobile SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-sbom
          path: mobile-sbom.spdx.json
          if-no-files-found: error

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from "packageManager" in package.json)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: License inventory (report-only)
        # Inventory for review, not yet an allowlist gate; `|| true` keeps it
        # non-blocking by design.
        run: pnpm licenses list --json > licenses.json || true

      - name: Upload license report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses
          path: licenses.json
          if-no-files-found: warn
